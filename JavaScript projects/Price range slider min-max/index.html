<!DOCTYPE html>
<html lang="en">
<head>
    <title>Price Range Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="gfg">
            GeeksForGeeks
        </div>
        <div class="content-wrapper">
        <div class="header">
            <h2>Price Range Slider</h2>
        </div>
        <div class="price-input-container">
            <div class="price-input">
        <div class="price-field">
            <span>Minimum Price</span>
            <input type="number" class="min-input" value="3000">
        </div>
        <div class="price-field">
            <span>Maximum Price</span>
            <input type="number" class="max-input" value="8500">
        </div>
        </div>
        <div class="Slider">
            <div class="price-slider"></div>
        </div>
        </div>
    
    <div class="range-input">
        <input type="range" class="min-range" min="0" max="10000" value="3000" step="1">
        <input type="range" class="max-range" min="0" max="10000" value="8500" step="1">
    </div>
    </div>
    </div>
    <script src="Script.js"></script>
</body>
</html>
